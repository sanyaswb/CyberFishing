<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101817" />
    <title>Будинок рибалки · CyberFishing</title>
    <link rel="preload" as="image" href="assets/house/room-1/lvl-1/room--1-day-lvl--1.jpg" />
    <link rel="preload" as="image" href="assets/house/room-1/room--1_aqua.png" />
    <link rel="stylesheet" href="src/game/presentation/styles/tokens.css?v=0.34.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/hud/time-display.css?v=0.34.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/inventory/theme.css?v=0.34.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/inventory/item-parameters.css?v=0.34.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/house.css?v=0.34.0" />
  </head>
  <body class="house">
    <a class="house__skip" href="#house-dock">До меню будинку</a>
    <header class="house__header" data-house-header>
      <div class="house__time-mount" data-house-time-mount></div>
      <a class="house__top-play" href="index.html" data-house-return aria-label="До риболовлі"><span aria-hidden="true">▶</span></a>
      <button class="house__fullscreen" type="button" data-house-fullscreen aria-label="На весь екран" title="На весь екран">⛶</button>
    </header>
    <main class="house__main">
      <div class="house__room-track" data-house-room-track tabindex="0" aria-label="Кімнати будинку. Стрілки ліворуч і праворуч перемикають кімнати.">
        <section class="house__room" data-house-room="Кімната 1" aria-label="Кімната 1">
          <div class="house__scene">
            <div class="house__artboard">
              <img class="house__background" data-house-background="day" alt="Постапокаліптична кімната рибалки" fetchpriority="high" />
              <img class="house__background house__background--evening" data-house-background="evening" alt="" aria-hidden="true" />
              <img class="house__background house__background--night" data-house-background="night" alt="" aria-hidden="true" />
              <div class="house__aquarium-stage" data-house-aquarium-stage hidden>
                <img class="house__aquarium-image" data-house-aquarium-image alt="Акваріум для живця на столі" />
                <canvas class="house__aquarium-fish" data-house-aquarium-fish aria-label="Живці плавають усередині акваріума"></canvas>
                <div class="house__aquarium-feed" data-house-feed-bar hidden>
                  <img data-house-feed-image alt="Прикормка для акваріума" />
                  <div class="house__aquarium-feed-body">
                    <div class="house__feed-slot-track" data-house-feed-track role="progressbar" aria-label="Запас прикормки" aria-valuemin="0" aria-valuemax="100"><div class="house__feed-slot-fill" data-house-feed-fill></div></div>
                    <span data-house-feed-time></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <div class="house__room-navigation" data-house-room-navigation hidden>
        <button class="house__arrow" type="button" data-house-room-prev aria-label="Попередня кімната">←</button>
        <span data-house-room-count>1 / 1</span>
        <button class="house__arrow" type="button" data-house-room-next aria-label="Наступна кімната">→</button>
      </div>
      <div class="house__scrim" data-house-scrim hidden></div>
      <nav class="house__dock" id="house-dock" data-house-dock aria-label="Меню будинку">
        <button class="house__dock-button" type="button" data-house-panel-button="room" aria-controls="house-panel-room" aria-expanded="false"><span aria-hidden="true">⌂</span><span>Кімната</span></button>
        <button class="house__dock-button" type="button" data-house-panel-button="aquarium" aria-controls="house-panel-aquarium" aria-expanded="false"><span aria-hidden="true">▤</span><span>Акваріум</span></button>
        <button class="house__dock-button" type="button" data-house-panel-button="bait" aria-controls="house-panel-bait" aria-expanded="false"><span aria-hidden="true">◈</span><span>Живець</span></button>
      </nav>
      <section class="house__sheet" id="house-panel-room" data-house-panel="room" aria-label="Прокачка кімнати" hidden>
        <div class="house__sheet-grip"></div>
        <div class="house__sheet-heading"><h1>Кімната <span data-house-room-level-panel>1</span> / <span data-house-room-max-level>5</span></h1><button class="house__close" type="button" data-house-panel-close aria-label="Закрити">×</button></div>
        <div class="inventory-parameter house__upgrade-card">
          <div class="inventory-parameter__header"><span class="inventory-parameter__label" data-house-room-next-level>Наступний рівень: 2</span><strong class="inventory-parameter__value" data-house-room-duration>2 год</strong></div>
          <div class="inventory-parameter__segments house__level-segments" data-house-room-segments aria-label="Прогрес рівнів кімнати"></div>
          <ol class="house__level-list" data-house-room-level-list></ol>
        </div>
        <button class="house__button house__button--primary" type="button" data-house-action="upgradeRoom">Прокачати · Безкоштовно</button>
      </section>
      <section class="house__sheet" id="house-panel-aquarium" data-house-panel="aquarium" aria-label="Акваріум і постачання" hidden>
        <div class="house__sheet-grip"></div>
        <div class="house__sheet-heading"><h2>Акваріум</h2><button class="house__close" type="button" data-house-panel-close aria-label="Закрити">×</button></div>
        <div class="inventory-parameter house__upgrade-card">
          <div class="inventory-parameter__header"><span class="inventory-parameter__label" data-house-level>Не встановлено</span><strong class="inventory-parameter__value" data-house-capacity>0 / 5</strong></div>
          <div class="inventory-parameter__segments house__level-segments" data-house-aquarium-segments aria-label="Прогрес рівнів акваріума"></div>
          <ol class="house__level-list" data-house-aquarium-level-list></ol>
        </div>
        <div data-house-unowned><button class="house__button house__button--primary" data-house-action="buyAquarium" type="button">Встановити · Безкоштовно</button></div>
        <div data-house-owned hidden>
          <button class="house__button" data-house-action="upgrade" type="button">Покращити · Безкоштовно</button>
          <div class="house__stat-row"><strong>Спільна прикормка</strong><span data-house-slot-count></span></div>
          <div class="house__action-row"><button class="house__button house__button--primary" data-house-action="feed" type="button">Засипати прикормку</button><span data-house-next-feed></span></div>
        </div>
        <div class="house__stat-row"><strong>Запас прикормки</strong><span data-house-feed-stock>0</span></div>
        <label class="house__feed-choice">Прикормка для акваріума <select data-house-feed-choice aria-label="Якість і фасування прикормки"></select></label>
        <button class="house__button" data-house-action="buyFeed" type="button">Отримати вибране фасування · Безкоштовно</button>
        <div class="house__stat-row"><strong>Автогодівниця</strong><span data-house-auto-status>Вручну</span></div>
        <button class="house__button" data-house-action="buyAutoFeeder" type="button">Встановити · Безкоштовно</button>
        <button class="house__button" data-house-action="toggleAutoFeeder" type="button" hidden>Увімкнути</button>
      </section>
      <section class="house__sheet" id="house-panel-bait" data-house-panel="bait" aria-label="Живець і садок" hidden>
        <div class="house__sheet-grip"></div>
        <div class="house__sheet-heading"><h2>Живець <span data-house-bait-count>0 риб</span></h2><button class="house__close" type="button" data-house-panel-close aria-label="Закрити">×</button></div>
        <div class="house__fish-list" data-house-live-baits></div>
        <p class="house__warning" data-house-keepnet-warning hidden>У садку живець втрачає час життя.</p>
        <p class="house__warning" data-house-dead-count hidden></p>
        <div class="house__stat-row"><strong>Садок</strong><span data-house-catch-count>0 риб</span></div>
        <div class="house__fish-list" data-house-catches></div>
      </section>
      <div class="house__renovation" data-house-renovation hidden role="status" aria-live="polite">
        <div class="house__renovation-shade"></div>
        <img class="house__renovation-image" src="assets/house/room-1/under-renovation.png" alt="Кімната на ремонті" />
        <div class="house__renovation-controls"><span data-house-renovation-level>Ремонт до рівня 2</span><strong data-house-renovation-time>02:00:00</strong><button class="house__button house__button--primary" type="button" data-house-action="finishRoom">Завершити · Безкоштовно</button></div>
      </div>
      <p class="house__notice" role="status" aria-live="polite" data-house-notice></p>
    </main>
    <script type="module" src="src/entrypoints/house.entry.js?v=0.34.0"></script>
  </body>
</html>

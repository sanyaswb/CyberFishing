    /* Spec 157 D0: the startup screen paints from this HTML alone, before the game's stylesheets and modules load;

    .startup-loader { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-content: center;
      justify-items: center; gap: 16px; background: #000; transition: opacity 0.3s ease, visibility 0s linear 0.3s; }
    .startup-loader__icon { width: 56px; height: 56px; animation: startup-loader-spin 1s linear infinite; }

    .startup-loader__progress { width: 160px; height: 4px; border-radius: 2px; overflow: hidden;
      background: rgba(255, 255, 255, 0.16); }
    .startup-loader__bar { display: block; width: 100%; height: 100%; background: #7fd1ff; transform-origin: left center;
      transform: scaleX(var(--startup-progress, 0)); transition: transform 0.2s linear; }
    .startup-loader__bytes { margin: 0; min-height: 1.2em; font: 13px/1.2 system-ui, sans-serif;
      font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, 0.72); }
    .startup-loader:not([data-startup-bytes]) .startup-loader__progress,
    .startup-loader:not([data-startup-bytes]) .startup-loader__bytes { display: none; }
    /* Spec 157 R3: a failed start shows its text and a retry button instead of the ring and the bar. */
    .startup-loader[data-startup-failed] .startup-loader__icon,
    .startup-loader[data-startup-failed] .startup-loader__progress,
    .startup-loader[data-startup-failed] .startup-loader__bytes { display: none; }
    .startup-loader__error { max-width: 280px; margin: 0; padding: 0 16px; text-align: center;
      font: 15px/1.35 system-ui, sans-serif; color: #fff; }
    .startup-loader__retry { min-height: 44px; padding: 0 20px; border: 1px solid #7fd1ff; border-radius: 8px;

    @keyframes startup-loader-spin { to { transform: rotate(360deg); } }

<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101817" />
    <title>Будинок рибалки · CyberFishing</title>
    <link rel="preload" as="image" href="assets/house/room-1/lvl-1/room--1-day-lvl--1.jpg" />
    <link rel="preload" as="image" href="assets/house/room-1/room--1_aqua.png" />
    <link rel="stylesheet" href="src/game/presentation/styles/tokens.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/ui-glyph.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/ui-surface.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/modal-controls.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/auto-switch.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/hud/game-controls.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/hud/time-display.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/inventory/theme.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/inventory/item-parameters.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/inventory/item-cards.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/inventory/resource-meters.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/inventory/shared-controls.css?v=0.36.0" />
    <link rel="stylesheet" href="src/game/presentation/styles/house.css?v=0.36.0" />
  </head>
  <body class="house">
    <a class="house__skip" href="#house-dock">До меню будинку</a>
    <header class="house__header" data-house-header>
      <div class="house__header-row" data-house-header-row>
        <div class="house__header-leading" data-house-dev-mount></div>
        <a class="hud-control hud-control--borderless house__top-play" href="index.html" data-house-return aria-label="До риболовлі"><span class="house__play-icon" aria-hidden="true">▶</span></a>
        <div class="house__header-trailing">
          <div class="house__hud-mount" data-house-fullscreen-mount></div>
          <div class="house__hud-mount" data-house-time-mount></div>
        </div>
      </div>
    </header>
    <main class="house__main">
      <div class="house__room-track" data-house-room-track tabindex="0" aria-label="Кімнати будинку. Стрілки ліворуч і праворуч перемикають кімнати.">
        <section class="house__room" data-house-room="Кімната 1" aria-label="Кімната 1">
          <div class="house__scene">
            <div class="house__artboard">
              <img class="house__background house__background--day" data-house-background="day" alt="Постапокаліптична кімната рибалки" fetchpriority="high" />
              <img class="house__background house__background--evening" data-house-background="evening" alt="" aria-hidden="true" />
              <img class="house__background house__background--night" data-house-background="night" alt="" aria-hidden="true" />
              <div class="house__aquarium-stage" data-house-aquarium-stage hidden>
                <img class="house__aquarium-image" data-house-aquarium-image alt="Акваріум для живця на столі" />
                <canvas class="house__aquarium-fish" data-house-aquarium-fish aria-label="Живці плавають усередині акваріума"></canvas>
                <div class="house__aquarium-feed" data-house-feed-bar hidden>
                  <img class="house__aquarium-feed-image" data-house-feed-image alt="Прикормка для акваріума" />
                  <div class="house__aquarium-feed-body">
                    <div class="house__feed-meter" data-house-feed-meter></div>
                    <span class="house__aquarium-feed-time" data-house-feed-time></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <div class="house__room-navigation" data-house-room-navigation hidden>
        <button class="house__arrow" type="button" data-house-room-prev aria-label="Попередня кімната">←</button>
        <span data-house-room-count>1 / 1</span>
        <button class="house__arrow" type="button" data-house-room-next aria-label="Наступна кімната">→</button>
      </div>
      <div class="house__scrim" data-house-scrim hidden></div>
      <nav class="house__dock" id="house-dock" data-house-dock aria-label="Меню будинку">
        <div class="house__dock-handle-mount" data-house-dock-handle-mount></div>
        <div class="house__dock-buttons">
          <button class="house__dock-button" type="button" data-house-panel-button="room" aria-label="Кімната" aria-controls="house-panel-room" aria-expanded="false"><span class="house__dock-icon" aria-hidden="true">⌂</span><span class="house__dock-label">Кімната</span></button>
          <button class="house__dock-button" type="button" data-house-panel-button="aquarium" aria-label="Акваріум" aria-controls="house-panel-aquarium" aria-expanded="false"><span class="house__dock-icon" aria-hidden="true">▤</span><span class="house__dock-label">Акваріум</span></button>
          <button class="house__dock-button" type="button" data-house-panel-button="bait" aria-label="Живець" aria-controls="house-panel-bait" aria-expanded="false"><span class="house__dock-icon" aria-hidden="true">◈</span><span class="house__dock-label">Живець</span></button>
        </div>
      </nav>
      <section class="house__sheet" id="house-panel-room" data-house-panel="room" aria-label="Прокачка кімнати" hidden>
        <div class="house__sheet-content">
        <div class="house__sheet-handle-mount" data-house-sheet-handle-mount></div>
        <div class="house__sheet-heading"><h1 class="house__sheet-title">Кімната <span data-house-room-level-panel>1</span> / <span data-house-room-max-level>5</span></h1></div>
        <div class="inventory-parameter house__upgrade-card">
          <div class="inventory-parameter__header"><span class="inventory-parameter__label house__upgrade-label" data-house-room-next-level>Наступний рівень: 2</span></div>
          <div class="inventory-parameter__segments house__level-segments" data-house-room-segments aria-label="Прогрес рівнів кімнати"></div>
          <div class="house__upgrade-details"><span data-house-room-level-count>1 / 5</span><span data-house-room-duration>2 год</span></div>
          <ol class="house__level-list" data-house-room-level-list></ol>
        </div>
        <button class="inventory-action inventory-action--primary house__button house__button--wide" type="button" data-house-action="upgradeRoom">Прокачати · Безкоштовно</button>
        </div>
      </section>
      <section class="house__sheet" id="house-panel-aquarium" data-house-panel="aquarium" aria-label="Акваріум і постачання" hidden>
        <div class="house__sheet-content">
        <div class="house__sheet-handle-mount" data-house-sheet-handle-mount></div>
        <div class="house__sheet-heading"><h2 class="house__sheet-title">Акваріум</h2></div>
        <div class="inventory-parameter house__upgrade-card">
          <div class="inventory-parameter__header house__stat-header" data-house-level role="group" aria-label="Рівень акваріума" title="Рівень акваріума"><svg class="house__stat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/ui/status-icons.svg#level"></use></svg><span data-house-aquarium-level-count>0 / 10</span></div>
          <div class="inventory-parameter__segments house__level-segments" data-house-aquarium-segments aria-label="Прогрес рівнів акваріума"></div>
          <div class="house__capacity"><div class="inventory-parameter__header house__stat-header" role="group" aria-label="Місткість акваріума" title="Місткість акваріума"><svg class="house__stat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/ui/status-icons.svg#fish"></use></svg><span data-house-capacity>0 / 0</span></div><div class="house__capacity-meter" data-house-capacity-meter></div></div>
          <div class="house__feeding-row"><button class="inventory-action inventory-action--primary house__button" data-house-feed-toggle aria-controls="house-feed-list" type="button">Прикормити</button><div class="house__feed-preview" data-house-next-feed role="group" aria-label="Обрана прикормка" tabindex="-1"></div></div>
          <p class="house__muted" data-house-feed-hint tabindex="-1" hidden></p>
          <div class="house__feed-list" id="house-feed-list" data-house-feed-list aria-label="Доступна прикормка з інвентарю" hidden></div>
        </div>
        <div data-house-unowned><button class="inventory-action inventory-action--primary house__button house__button--wide" data-house-action="buyAquarium" type="button">Встановити · Безкоштовно</button></div>
        <div data-house-owned hidden>
          <button class="inventory-action inventory-action--primary house__button house__button--wide house__upgrade-action" data-house-action="upgrade" aria-label="Рівень 2 · Місткість 6" type="button"><span class="house__stat-header"><svg class="house__stat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/ui/status-icons.svg#level"></use></svg><span data-house-upgrade-level>2</span></span><span class="house__stat-header"><svg class="house__stat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="assets/ui/status-icons.svg#fish"></use></svg><span data-house-upgrade-capacity>6</span></span></button>
        </div>
        <div class="house__stat-row"><strong>Автогодівниця</strong><span data-house-auto-status>Вручну</span></div>
        <button class="inventory-action inventory-action--primary house__button house__button--wide" data-house-action="buyAutoFeeder" type="button">Встановити · Безкоштовно</button>
        <div class="house__auto-switch-mount" data-house-auto-switch-mount hidden></div>
        </div>
      </section>
      <section class="house__sheet" id="house-panel-bait" data-house-panel="bait" aria-label="Живець і садок" hidden>
        <div class="house__sheet-content">
        <div class="house__sheet-handle-mount" data-house-sheet-handle-mount></div>
        <div class="house__sheet-heading"><h2 class="house__sheet-title">Живець <span class="house__sheet-meta" data-house-bait-count>0 риб</span></h2></div>
        <div class="house__fish-list" data-house-live-baits></div>
        <p class="house__warning" data-house-keepnet-warning hidden>У садку живець втрачає час життя.</p>
        <p class="house__warning" data-house-dead-count hidden></p>
        <div class="house__stat-row"><strong>Садок</strong><span data-house-catch-count>0 риб</span></div>
        <div class="house__fish-list" data-house-catches></div>
        </div>
      </section>
      <div class="house__renovation" data-house-renovation hidden role="status" aria-live="polite">
        <div class="house__renovation-shade"></div>
        <img class="house__renovation-image" src="assets/house/room-1/under-renovation.png" alt="Кімната на ремонті" />
        <div class="house__renovation-controls"><span data-house-renovation-level>Ремонт до рівня 2</span><strong class="house__renovation-time" data-house-renovation-time>02:00:00</strong><button class="inventory-action inventory-action--primary house__button" type="button" data-house-action="finishRoom">Завершити · Безкоштовно</button></div>
      </div>
      <div class="ui-hint house__notice" role="status" aria-live="polite" data-house-notice hidden><p class="ui-hint__text" data-house-notice-text></p><button class="ui-modal-close ui-hint__close" type="button" title="Закрити повідомлення" aria-label="Закрити повідомлення" data-house-notice-close>×</button></div>
    </main>
    <script type="module" src="src/entrypoints/house.entry.js?v=0.36.0"></script>
  </body>
</html>
